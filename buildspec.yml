version: 0.2
phases:
  install:
    on-failure: ABORT
    runtime-versions:
      python: 3.12
  pre_build:
    on-failure: ABORT
    commands:
    - mkdir artifacts
    - |
      # Ensure consistent hash generation across platforms
      powershell -Command "& {
        $ErrorActionPreference = 'Stop'
        
        # Function to generate consistent file hash
        function Get-ConsistentFileHash {
            param (
                [string]$DirectoryPath
            )
            
            # Get all files, sort them, and generate a combined hash
            $files = Get-ChildItem -Path $DirectoryPath -Recurse -File | 
                     Sort-Object FullName | 
                     ForEach-Object { 
                         $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
                         $_.FullName + ':' + $hash 
                     }
            
            $combinedHash = ($files | Out-String | Get-FileHash -Algorithm SHA256).Hash
            return $combinedHash
        }
        
        # Generate hashes for each layer
        $commonModulesHash = Get-ConsistentFileHash -DirectoryPath "infra_automation/common_modules"
        $numpyLayerHash = Get-ConsistentFileHash -DirectoryPath "numpy_modules"
        $pandasLayerHash = Get-ConsistentFileHash -DirectoryPath "pandas_modules"
        
        # Output hashes
        Write-Host "Common Modules Layer Hash: $commonModulesHash"
        Write-Host "NumPy Layer Hash: $numpyLayerHash"
        Write-Host "Pandas Layer Hash: $pandasLayerHash"
      }"
  build:
    on-failure: ABORT
    commands:
      - echo "Build script execution."
  post_build:
    on-failure: ABORT
    commands:
      - aws cloudformation package --template-file template.yml --s3-bucket $BUILD_OUTPUT_BUCKET --s3-prefix $BUILD_OUTPUT_PREFIX --output-template-file artifacts/packaged.yaml
artifacts:
  type: zip
  files:
    - 'artifacts/**/*'