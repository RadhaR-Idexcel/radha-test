version: 0.2

phases:
  install:
    on-failure: ABORT
    runtime-versions:
      python: 3.12

  pre_build:
    on-failure: ABORT
    commands:
      - mkdir -p artifacts
      - |
        COMMON_MODULES_HASH=$(find infra_automation/common_modules -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
        NUMPY_LAYER_HASH=$(find infra_automation/numpy_modules -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
        PANDAS_LAYER_HASH=$(find infra_automation/pandas_modules -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)

        echo "Common Modules Layer Hash: $COMMON_MODULES_HASH"
        echo "NumPy Layer Hash: $NUMPY_LAYER_HASH"
        echo "Pandas Layer Hash: $PANDAS_LAYER_HASH"

        # Upload layer contents to S3 using hash as key
        aws s3 cp infra_automation/common_modules/ s3://$BUILD_OUTPUT_BUCKET/common_modules/$COMMON_MODULES_HASH/ --recursive
        aws s3 cp infra_automation/numpy_modules/ s3://$BUILD_OUTPUT_BUCKET/numpy_modules/$NUMPY_LAYER_HASH/ --recursive
        aws s3 cp infra_automation/pandas_modules/ s3://$BUILD_OUTPUT_BUCKET/pandas_modules/$PANDAS_LAYER_HASH/ --recursive

  build:
    on-failure: ABORT
    commands:
      - echo "Build script execution."

  post_build:
    on-failure: ABORT
    commands:
      - aws cloudformation package --template-file template.yml --s3-bucket $BUILD_OUTPUT_BUCKET --s3-prefix $BUILD_OUTPUT_PREFIX --output-template-file artifacts/packaged.yaml
      - |
        # Deploy the stack with updated parameters
        aws cloudformation deploy \
          --template-file artifacts/packaged.yaml \
          --stack-name Los-Dev-LambdaLayers-MS \
          --parameter-overrides \
            CommonModulesHash=$COMMON_MODULES_HASH \
            NumPyLayerHash=$NUMPY_LAYER_HASH \
            PandasLayerHash=$PANDAS_LAYER_HASH

artifacts:
  type: zip
  files:
    - 'artifacts/**/*'
