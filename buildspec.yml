version: 0.2

phases:
  install:
    on-failure: ABORT
    runtime-versions:
      python: 3.12

  pre_build:
    on-failure: ABORT
    commands:
      - eval $PreBuildScript  # Run custom pre-build script (if provided)
      - pip install -r requirements.txt  # Install dependencies

  build:
    on-failure: ABORT
    commands:
      - echo "Build script execution."

  post_build:
    on-failure: ABORT
    commands:
      - aws cloudformation package --template-file template.yml --s3-bucket $BUILD_OUTPUT_BUCKET --s3-prefix $BUILD_OUTPUT_PREFIX --output-template-file artifacts/packaged.yaml

artifacts:
  type: zip
  files:
    - 'artifacts/**/*'
