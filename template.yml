AWSTemplateFormatVersion: 2010-09-09
Description: A CloudFormation template to create Serverless Resources for ClientOnBoarding Service
Transform: AWS::Serverless-2016-10-31

Parameters:
  ResourceNamePrefix:
    Type: String
    Default: Los
  EnvironmentType:
    Type: String
    Default: Dev
  ServiceName:
    Type: String
    Default: ClientOnBoarding
  CommonModulesHash:
    Type: String
  NumPyLayerHash:
    Type: String
  PandasLayerHash:
    Type: String

Resources:
  CommonModuleLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: A Lambda LayerVersion for ClientOnBoarding Function.
      LayerName: !Sub "${ResourceNamePrefix}-${EnvironmentType}-${ServiceName}-CommonModule-Layer"
      ContentUri: !Sub "artifacts/common_modules_${CommonModulesHash}.zip"
      CompatibleRuntimes:
        - python3.11
        - python3.12
        - python3.9
      LicenseInfo: MIT
      RetentionPolicy: Retain
    Metadata:
      Hash: !Ref CommonModulesHash

  NumPyLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: Lambda Layer for NumPy dependencies
      LayerName: !Sub "${ResourceNamePrefix}-${EnvironmentType}-${ServiceName}-NumPy-Layer"
      ContentUri: !Sub "artifacts/numpy_modules_${NumPyLayerHash}.zip"
      CompatibleRuntimes:
        - python3.11
        - python3.12
        - python3.9
      LicenseInfo: MIT
      RetentionPolicy: Retain
    Metadata:
      Hash: !Ref NumPyLayerHash

  PandasLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: Lambda Layer for Pandas dependencies
      LayerName: !Sub "${ResourceNamePrefix}-${EnvironmentType}-${ServiceName}-Pandas-Layer"
      ContentUri: !Sub "artifacts/pandas_modules_${PandasLayerHash}.zip"
      CompatibleRuntimes:
        - python3.11
        - python3.12
      LicenseInfo: MIT
      RetentionPolicy: Retain
    Metadata:
      Hash: !Ref PandasLayerHash
