AWSTemplateFormatVersion: 2010-09-09
Description: A CloudFormation template to create Serverless Resources for ClientOnBoarding Service
Transform: AWS::Serverless-2016-10-31
Parameters:
  ResourceNamePrefix:
    Type: String
    Description: Enter prefix for resource names.
    Default: Los
  EnvironmentType:
    Type: String
    Description: Enter environment type according to need.
    Default: Dev
  ServiceName:
    Type: String
    Description: Enter the service name for which the resources are being created.
    Default: ClientOnBoarding
  ForceLayerUpdate:
    Type: String
    Description: Parameter to control whether to force a layer update
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

Conditions:
  ShouldUpdateLayers: !Equals [!Ref ForceLayerUpdate, "true"]

Resources:
  CommonModuleLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: A Lambda LayerVersion for ClientOnBoarding Function.
      LayerName:
        Fn::Sub: ${ResourceNamePrefix}-${EnvironmentType}-${ServiceName}-CommonModule-Layer
      ContentUri: infra_automation/common_modules/
      CompatibleRuntimes:
      - python3.11
      - python3.12
      - python3.9
      LicenseInfo: MIT
      RetentionPolicy: Retain

  NumPyLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: Lambda Layer for NumPy dependencies
      LayerName:
        Fn::Sub: ${ResourceNamePrefix}-${EnvironmentType}-${ServiceName}-NumPy-Layer
      ContentUri: infra_automation/numpy_modules/
      CompatibleRuntimes:
      - python3.11
      - python3.12
      - python3.9
      LicenseInfo: MIT
      RetentionPolicy: Retain

  PandasLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: Lambda Layer for Pandas dependencies
      LayerName:
        Fn::Sub: ${ResourceNamePrefix}-${EnvironmentType}-${ServiceName}-Pandas-Layer
      ContentUri: infra_automation/pandas_modules/
      CompatibleRuntimes:
      - python3.11
      - python3.12
      LicenseInfo: MIT
      RetentionPolicy: Retain

Outputs:
  CommonModuleLayerArn:
    Description: ARN of the CommonModule layer
    Value: !Ref CommonModuleLayer
    Export:
      Name: !Sub "${ResourceNamePrefix}-${EnvironmentType}-${ServiceName}-CommonModule-Layer-Arn"
  
  NumPyLayerArn:
    Description: ARN of the NumPy layer
    Value: !Ref NumPyLayer
    Export:
      Name: !Sub "${ResourceNamePrefix}-${EnvironmentType}-${ServiceName}-NumPy-Layer-Arn"
  
  PandasLayerArn:
    Description: ARN of the Pandas layer
    Value: !Ref PandasLayer
    Export:
      Name: !Sub "${ResourceNamePrefix}-${EnvironmentType}-${ServiceName}-Pandas-Layer-Arn"